<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page</title>
    <link rel="stylesheet" href="../css/mainpage.css">
</head>

<body>

<nav class="titleline">

    <a href="/">
        <button name="logo_button" id="logo-button">
            <img src="logo.png" alt="home">
        </button>
    </a>

    <input id="searchbox" type="search" placeholder="search for a specific restaurant...">

    <button name="manager_button" id="manager-button"> I'm a restaurant manager +
    </button>

    <button id="mystore-button" onclick="window.location.href='/my_restaurant.html'" style="display:none;">
        My Restaurant
    </button>

    <button name="likes_button" id="likes-button">
        <img src="../heart.png" alt="likes">
    </button>


    <button name="login_button" id="login-button">
        <img src="../profile_icon.png" alt="profile">
    </button>
    

    <div id="settingMenu" class="setting-menu">
        <a href="#">Profile</a>
        <a href="#">Settings</a>
        <a href="#">Logout</a>
    </div>

</nav>

<div class="dishphoto_arrange">

    <a href="restaurant_italian.html">
        <img src="../Italianfood.png">
    </a>

    <a href="restaurant_chinese.html">
        <img src="../chinesefood.png">
    </a>

    <a href="restaurant_japanese.html">
        <img src="../Japanesefood.png">
    </a>

    <a href="restaurant_korean.html">
        <img src="../Koreanfood.png">
    </a>

    <a href="restaurant_french.html">
        <img src="../Frenchfood.png">
    </a>

    <a href="restaurant_thai.html">
        <img src="../Thaifood.png">
    </a>

    <a href="restaurant_indian.html">
        <img src="../Indianfood.png">
    </a>

</div>

<div id="modal-container"></div>

<script src="../java/login_window.js"></script>

<script>
document.getElementById('searchbox').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        const value = this.value.trim();
        if (value) {
            window.location.href = '/search_results.html?q=' + encodeURIComponent(value);
        }
    }
});
</script>

</body>
</html>
