<!-- ===== General User Login ===== -->
<div id="login-popup" class="modal-overlay">
    <div class="modal-box">

        <button class="btn-close"
            onclick="document.getElementById('login-popup').style.display='none'">✕</button>

        <h2 class="modal-title">Welcome Back</h2>

        <input id="login-email" type="email" placeholder="email" class="modal-input">
        <input id="login-password" type="password" placeholder="password" class="modal-input">
        <p id="login-error" style="color:red; font-size:13px; margin-bottom:8px; display:none;"></p>

        <button class="btn-login" onclick="submitLogin()">Login</button>
        <button class="btn-forget-password">Forget Password?</button>

        <p>Don't have an account?
            <button class="btn-register" onclick="register_popup()">Register</button>
        </p>

    </div>
</div>


<!-- ===== General User Register ===== -->
<div id="register-popup" class="modal-overlay">
    <div class="modal-box">

        <button class="btn-close"
            onclick="document.getElementById('register-popup').style.display='none'">✕</button>

        <h2 class="modal-title">Register</h2>

        <input id="register-email" type="email" placeholder="email" class="modal-input">
        <input id="register-password" type="password" placeholder="create password" class="modal-input">
        <input id="register-confirm" type="password" placeholder="confirm password" class="modal-input">
        <p id="register-error" style="color:red; font-size:13px; margin-bottom:8px; display:none;"></p>

        <button class="btn-login" onclick="submitRegister('user')">Create Account</button>

    </div>
</div>
