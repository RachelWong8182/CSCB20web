<div id="login-popup" style="display:none; position:fixed; inset:0;
     background:rgba(0,0,0,0.4); align-items:center; justify-content:center; z-index:999;">

    <div style="background:white; padding:2rem; border-radius:16px;
                width:380px; text-align:center; box-shadow: 0 4px 20px rgba(0,0,0,0.2);">

        <h2 style="margin-bottom:1.5rem;">Welcome to xxx</h2>

        <input type="email" placeholder="email"
               style="width:100%; padding:14px; margin-bottom:1rem;
                      border-radius:30px; border:none; background:#2d2d2d;
                      color:white; font-size:15px; box-sizing:border-box;">

        <input type="password" placeholder="create password"
               style="width:100%; padding:14px; margin-bottom:1rem;
                      border-radius:30px; border:none; background:#2d2d2d;
                      color:white; font-size:15px; box-sizing:border-box;">

        <input type="password" placeholder="confirm password"
               style="width:100%; padding:14px; margin-bottom:1.5rem;
                      border-radius:30px; border:none; background:#2d2d2d;
                      color:white; font-size:15px; box-sizing:border-box;">

        <button style="width:100%; padding:14px; border-radius:30px; border:none;
                       background:#cc66ff; color:white; font-size:16px;
                       font-weight:bold; cursor:pointer; margin-bottom:0.75rem;">
            register
        </button>

        <button onclick="document.getElementById('login-modal').style.display='none'"
                style="width:100%; padding:10px; border-radius:10px; border:1px solid #ccc;
                       background:white; font-size:14px; cursor:pointer;">
            Close
        </button>

    </div>
</div>
