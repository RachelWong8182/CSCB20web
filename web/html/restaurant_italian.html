<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Shop Listing</title>
    <link rel="stylesheet" href="css/restaurant_listing.css">
</head>

<body>
    <nav class="titleline">
        <input id="searchbox" type="search" placeholder="search for a specific restaurant...">

        <button onclick="login_popup()" id="login-button">
            <img src="profile_icon.png" alt="profile">
        </button>

        <div id="settingMenu" class="setting-menu">
            <a href="#">Profile</a>
            <a href="#">Settings</a>
            <a href="#">Logout</a>
        </div>
    </nav>

    <div class="page">

        <nav class="filter-bar">
            <button class="filter-btn" data-filter="distance">Distance</button>
            <button class="filter-btn" data-filter="rating">Rating</button>
            <button class="filter-btn" data-filter="price">Average Cost</button>
        </nav>

        <section class="restaurant-list" id="restaurantList">

            <button class="restaurant-card">
                <div class="restaurant-info">
                <div class="restaurant-name">Restaurant 1</div>
                <div class="restaurant-meta">Rating: 4.8</div>
                <div class="restaurant-meta">Average Cost: $22/person</div>
                <div class="restaurant-meta">Distance: 1.2 km</div>
                </div>
            </button>

            <button class="restaurant-card">
                <div class="restaurant-info">
                    <div class="restaurant-name">Restaurant 2</div>
                    <div class="restaurant-meta">Rating: 4.6</div>
                    <div class="restaurant-meta">Average Cost: $18/person</div>
                    <div class="restaurant-meta">Distance: 0.8 km</div>
                </div>
            </button>

            <button class="restaurant-card">
                <div class="restaurant-info">
                    <div class="restaurant-name">Restaurant 3</div>
                    <div class="restaurant-meta">Rating: 4.5</div>
                    <div class="restaurant-meta">Average Cost: $16/person</div>
                    <div class="restaurant-meta">Distance: 2.5 km</div>
            </div>
            </button>

            <button class="restaurant-card">
                <div class="restaurant-info">
                    <div class="restaurant-name">Restaurant 4</div>
                    <div class="restaurant-meta">Rating: 4.7</div>
                    <div class="restaurant-meta">Average Cost: $20/person</div>
                    <div class="restaurant-meta">Distance: 1.9 km</div>
                </div>
            </button>

            <button class="restaurant-card">
                <div class="restaurant-info">
                    <div class="restaurant-name">Restaurant 5</div>
                    <div class="restaurant-meta">Rating: 4.4</div>
                    <div class="restaurant-meta">Average Cost: $14/person</div>
                    <div class="restaurant-meta">Distance: 3.1 km</div>
                </div>
            </button>
        </section>
    </div>
    <div id="modal-container"></div>
    <script src="/java/login_window.js"></script>

</body>
</html>
