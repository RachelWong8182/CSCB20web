<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Shop Listing</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f2f2;
            min-height: 100vh;
            padding: 0;
            color: #222;
        }

        .page {
            width: 100vw;
            min-height: 100vh;
            background: #efefef;
            border-radius: 0;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .top-bar {
            display: grid;
            grid-template-columns: 88px 1fr 88px;
            gap: 14px;
            align-items: center;
            margin-bottom: 14px;
        }

        .pill-btn,
        .search-input {
            height: 48px;
            border-radius: 999px;
            border: none;
            outline: none;
            font-size: 16px;
        }

        .pill-btn {
            background: #333;
            color: white;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

            .pill-btn:hover,
            .restaurant-card:hover,
            .filter-btn:hover {
                transform: translateY(-1px);
                opacity: 0.95;
            }

        .search-input {
            width: 100%;
            background: #333;
            color: white;
            text-align: center;
            padding: 0 18px;
        }

            .search-input::placeholder {
                color: #e8e8e8;
            }

        .filter-bar {
            display: flex;
            gap: 10px;
            background: #c864ee;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 14px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
        }

        .filter-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 14px;
            cursor: pointer;
            padding: 2px 0;
        }

        .restaurant-list {
            height: calc(100vh - 140px);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 4px;
        }

            .restaurant-list::-webkit-scrollbar {
                width: 10px;
            }

            .restaurant-list::-webkit-scrollbar-thumb {
                background: #c78be4;
                border-radius: 999px;
            }

        .restaurant-card {
            width: 100%;
            border: none;
            background: #d8a6ea;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            text-align: left;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

            .restaurant-card:focus-visible,
            .pill-btn:focus-visible,
            .filter-btn:focus-visible,
            .search-input:focus-visible {
                outline: 3px solid #7d3cff;
                outline-offset: 2px;
            }

            .restaurant-card.active {
                border: 2px solid #5f36ff;
            }

        .restaurant-image {
            flex: 0 0 120px;
            height: 88px;
            border-radius: 6px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #333;
            font-weight: bold;
        }

        .restaurant-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .restaurant-name {
            font-size: 18px;
            font-weight: 700;
        }

        .restaurant-meta {
            font-size: 15px;
            color: #222;
        }

        @media (max-width: 640px) {
            .top-bar {
                grid-template-columns: 76px 1fr 76px;
                gap: 10px;
            }

            .restaurant-card {
                flex-direction: column;
                align-items: stretch;
            }

            .restaurant-image {
                width: 100%;
                flex-basis: auto;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="top-bar">
            <button class="pill-btn" id="logoBtn">Logo</button>
            <input type="text"
                   id="searchInput"
                   class="search-input"
                   placeholder="searching"
                   aria-label="Search restaurants" />
            <button class="pill-btn" id="loginBtn">Login</button>
        </header>

        <nav class="filter-bar" aria-label="restaurant filters">
            <button class="filter-btn" data-filter="distance">Distance</button>
            <button class="filter-btn" data-filter="rating">Rating</button>
            <button class="filter-btn" data-filter="price">Average Cost</button>
        </nav>

        <main>
            <section class="restaurant-list" id="restaurantList">
                <button class="restaurant-card" data-name="1" data-rating="4.8" data-price="$22/person" data-distance="1.2">
                    <div class="restaurant-image">Restaurant Photo</div>
                    <div class="restaurant-info">
                        <div class="restaurant-name">1</div>
                        <div class="restaurant-meta">Restaurant Rating: 4.8</div>
                        <div class="restaurant-meta">Average Cost: $22/person</div>
                        <div class="restaurant-meta">Distance: 1.2 km</div>
                    </div>
                </button>

                <button class="restaurant-card active" data-name="2" data-rating="4.6" data-price="$18/person" data-distance="0.8">
                    <div class="restaurant-image">Restaurant Photo</div>
                    <div class="restaurant-info">
                        <div class="restaurant-name">2</div>
                        <div class="restaurant-meta">Restaurant Rating: 4.6</div>
                        <div class="restaurant-meta">Average Cost: $18/person</div>
                        <div class="restaurant-meta">Distance: 0.8 km</div>
                    </div>
                </button>

                <button class="restaurant-card" data-name="3" data-rating="4.5" data-price="$16/person" data-distance="2.5">
                    <div class="restaurant-image">Restaurant Photo</div>
                    <div class="restaurant-info">
                        <div class="restaurant-name">3</div>
                        <div class="restaurant-meta">Restaurant Rating: 4.5</div>
                        <div class="restaurant-meta">Average Cost: $16/person</div>
                        <div class="restaurant-meta">Distance: 2.5 km</div>
                    </div>
                </button>

                <button class="restaurant-card" data-name="4" data-rating="4.7" data-price="$20/person" data-distance="1.9">
                    <div class="restaurant-image">Restaurant Photo</div>
                    <div class="restaurant-info">
                        <div class="restaurant-name">4</div>
                        <div class="restaurant-meta">Restaurant Rating: 4.7</div>
                        <div class="restaurant-meta">Average Cost: $20/person</div>
                        <div class="restaurant-meta">Distance: 1.9 km</div>
                    </div>
                </button>

                <button class="restaurant-card" data-name="5" data-rating="4.4" data-price="$14/person" data-distance="3.1">
                    <div class="restaurant-image">Restaurant Photo</div>
                    <div class="restaurant-info">
                        <div class="restaurant-name">5</div>
                        <div class="restaurant-meta">Restaurant Rating: 4.4</div>
                        <div class="restaurant-meta">Average Cost: $14/person</div>
                        <div class="restaurant-meta">Distance: 3.1 km</div>
                    </div>
                </button>

                <button class="restaurant-card" data-name="6" data-rating="4.9" data-price="$28/person" data-distance="0.6">
                    <div class="restaurant-image">Restaurant Photo</div>
                    <div class="restaurant-info">
                        <div class="restaurant-name">6</div>
                        <div class="restaurant-meta">Restaurant Rating: 4.9</div>
                        <div class="restaurant-meta">Average Cost: $28/person</div>
                        <div class="restaurant-meta">Distance: 0.6 km</div>
                    </div>
                </button>

                <button class="restaurant-card" data-name="7" data-rating="4.3" data-price="$19/person" data-distance="2.2">
                    <div class="restaurant-image">Restaurant Photo</div>
                    <div class="restaurant-info">
                        <div class="restaurant-name">7</div>
                        <div class="restaurant-meta">Restaurant Rating: 4.3</div>
                        <div class="restaurant-meta">Average Cost: $19/person</div>
                        <div class="restaurant-meta">Distance: 2.2 km</div>
                    </div>
                </button>
            </section>
        </main>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const restaurantCards = Array.from(document.querySelectorAll('.restaurant-card'));
        const filterButtons = document.querySelectorAll('.filter-btn');
        const restaurantList = document.getElementById('restaurantList');

        searchInput.addEventListener('input', () => {
            const keyword = searchInput.value.trim().toLowerCase();

            restaurantCards.forEach(card => {
                const name = card.dataset.name.toLowerCase();
                const visible = name.includes(keyword);
                card.style.display = visible ? 'flex' : 'none';
            });
        });

        restaurantCards.forEach(card => {
            card.addEventListener('click', () => {
                restaurantCards.forEach(item => item.classList.remove('active'));
                card.classList.add('active');
            });
        });

        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                const type = button.dataset.filter;
                const visibleCards = restaurantCards.filter(card => card.style.display !== 'none');

                visibleCards.sort((a, b) => {
                    if (type === 'rating') {
                        return Number(b.dataset.rating) - Number(a.dataset.rating);
                    }

                    if (type === 'price') {
                        return extractPrice(a.dataset.price) - extractPrice(b.dataset.price);
                    }

                    if (type === 'distance') {
                        return Number(a.dataset.distance) - Number(b.dataset.distance);
                    }

                    return a.dataset.name.localeCompare(b.dataset.name, undefined, { numeric: true });
                });

                visibleCards.forEach(card => restaurantList.appendChild(card));
            });
        });

        function extractPrice(priceText) {
            const match = priceText.match(/\d+/);
            return match ? Number(match[0]) : 0;
        }

        document.getElementById('logoBtn').addEventListener('click', () => {
            alert('Logo button clicked');
        });

        document.getElementById('loginBtn').addEventListener('click', () => {
            alert('Login button clicked');
        });
    </script>
</body>
</html>
